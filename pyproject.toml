[project]
name = "humancorpus"
version = "0.1.0"
description = "Searchable corpus of verifiably human-written sentence fragments, exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2", "pyarrow>=14"]

[project.optional-dependencies]
semantic = ["model2vec>=0.3", "numpy"]
eval = ["anthropic>=0.70"]
rerank = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.24"]
fast = ["model2vec>=0.3", "numpy", "tantivy>=0.24", "faiss-cpu>=1.8"]

[project.scripts]
humancorpus = "humancorpus.cli:main"
humancorpus-mcp = "humancorpus.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["humancorpus"]
